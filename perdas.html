    <script>
        // COLE AQUI A URL DO SEU GOOGLE APPS SCRIPT (Web App):
        const URL_API = "https://script.google.com/macros/s/AKfycbyQk4UZSj0qLj4aXuVd-qNKfZbNpUNFgqoC592s5CSjgd1MH5HBSpuOoJHvyoPqoigZ/exec";

        // Função para Salvar os Dados na Planilha do Google
        function salvarDados() {
            const botao = document.querySelector('.btn-salvar');
            botao.innerText = "Salvando...";
            botao.disabled = true;

            let dadosParaSalvar = {};
            
            // Coleta dados principais
            dadosParaSalvar['loja_nome'] = document.getElementById('loja-nome').value;
            dadosParaSalvar['data_registro'] = document.getElementById('data-registro').value;

            // Coleta todos os inputs da página de forma dinâmica
            const inputs = document.querySelectorAll('.editable-input');
            inputs.forEach((input, index) => {
                dadosParaSalvar['input_' + index] = input.value;
            });

            // Envia para o Google Apps Script via POST
            fetch(URL_API, {
                method: 'POST',
                mode: 'no-cors',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(dadosParaSalvar)
            })
            .then(() => {
                alert('Dados salvos com sucesso na nuvem!');
                botao.innerText = "💾 Salvar Alterações";
                botao.disabled = false;
            })
            .catch(error => {
                console.error('Erro:', error);
                alert('Erro ao salvar os dados.');
                botao.innerText = "💾 Salvar Alterações";
                botao.disabled = false;
            });
        }

        // Função para Carregar os Dados automaticamente da Nuvem
        function carregarDados() {
            if (!URL_API || URL_API.includes("COLE_AQUI")) return;

            fetch(URL_API)
            .then(response => response.json())
            .then(data => {
                if (data.status === "sucesso" && data.dados) {
                    let salvos = typeof data.dados === 'string' ? JSON.parse(data.dados) : data.dados;
                    
                    if (salvos['loja_nome']) document.getElementById('loja-nome').value = salvos['loja_nome'];
                    if (salvos['data_registro']) document.getElementById('data-registro').value = salvos['data_registro'];

                    // Restaura os valores de todos os inputs
                    const inputs = document.querySelectorAll('.editable-input');
                    inputs.forEach((input, index) => {
                        if (salvos['input_' + index] !== undefined) {
                            input.value = salvos['input_' + index];
                        }
                    });
                }
            })
            .catch(error => console.log('Ainda não há dados salvos ou ocorreu um erro ao carregar:', error));
        }

        // Executa o carregamento assim que a página é aberta em qualquer computador
        window.onload = function() {
            carregarDados();
        };
    </script>
