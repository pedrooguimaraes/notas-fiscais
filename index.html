<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Notas Fiscais App</title>
    <style>
        :root { --primary: #2c3e50; --bg: #f8f9fa; --border: #e9ecef; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg); margin: 0; padding: 20px; color: #333; }
        .container { max-width: 1200px; margin: auto; }
        
        /* Header */
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .title-group h1 { margin: 0; font-size: 24px; }
        .title-group p { margin: 0; color: #666; font-size: 14px; }
        .btn { padding: 10px 20px; border-radius: 4px; border: none; cursor: pointer; font-weight: 600; font-size: 13px; }
        .btn-pdf { background: #fff; border: 1px solid #ccc; margin-right: 10px; }
        .btn-add { background: #2c3e50; color: white; }

        /* Dashboard Cards */
        .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: white; padding: 20px; border-radius: 6px; border: 1px solid var(--border); }
        .stat-card small { color: #888; text-transform: uppercase; font-size: 11px; }
        .stat-card h2 { margin: 10px 0 0 0; font-size: 22px; }

        /* Filter Bar */
        .filters { background: white; padding: 20px; border-radius: 6px; border: 1px solid var(--border); margin-bottom: 20px; display: flex; gap: 15px; }
        .filters input, .filters select { padding: 8px; border: 1px solid #ccc; border-radius: 4px; flex-grow: 1; }

        /* Table */
        .data-box { background: white; border-radius: 6px; border: 1px solid var(--border); overflow: hidden; }
        table { width: 100%; border-collapse: collapse; }
        th { background: #fdfdfd; padding: 15px; text-align: left; font-size: 12px; color: #555; border-bottom: 1px solid var(--border); }
        td { padding: 15px; font-size: 13px; border-bottom: 1px solid var(--border); }
        .status-pill { background: #fee; color: #c0392b; padding: 4px 8px; border-radius: 10px; font-size: 11px; font-weight: bold; }
        
        /* Modal */
        .modal-overlay { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.4); justify-content:center; align-items:center; }
        .modal { background: white; width: 600px; padding: 30px; border-radius: 8px; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
        input { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    </style>
</head>
<body>
    <div class="container">
        <div class="top-bar">
            <div class="title-group">
                <h1>📁 Notas Fiscais</h1>
                <p>Gerenciamento de recebimento</p>
            </div>
            <div>
                <button class="btn btn-pdf" onclick="window.print()">📄 Gerar Relatório / PDF</button>
                <button class="btn btn-add" onclick="document.getElementById('modal').style.display='flex'">+ Nova Nota Fiscal</button>
            </div>
        </div>

        <div class="stats">
            <div class="stat-card"><small>Total de Notas</small><h2>52</h2></div>
            <div class="stat-card"><small>Valor Total</small><h2>R$ 111.508,37</h2></div>
            <div class="stat-card"><small>Não Acatadas</small><h2>52</h2></div>
            <div class="stat-card"><small>Acatadas</small><h2>0</h2></div>
        </div>

        <div class="filters">
            <select><option>Status Nota: Todos</option></select>
            <input type="text" placeholder="Filtrar Data">
            <input type="text" placeholder="Fornecedor">
            <button class="btn" style="border: 1px solid #ccc">🔍 Filtrar</button>
        </div>

        <div class="data-box">
            <table>
                <thead>
                    <tr><th>Data</th><th>Fornecedor</th><th>NF</th><th>Valor</th><th>Status</th><th>Ações</th></tr>
                </thead>
                <tbody>
                    <tr><td>2026-07-13</td><td>CD FLV / PANIF.</td><td>252709</td><td>R$ 0,00</td><td><span class="status-pill">NÃO ACATADA</span></td><td>✏️ 🗑️</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="modal-overlay" id="modal">
        <div class="modal">
            <h3>Nova Nota Fiscal</h3>
            <div class="form-grid">
                <input type="text" placeholder="Data">
                <input type="text" placeholder="Fornecedor">
                <input type="text" placeholder="Número da NF">
                <input type="text" placeholder="Valor (R$)">
            </div>
            <div style="margin-top:20px; text-align:right;">
                <button class="btn" onclick="document.getElementById('modal').style.display='none'">Cancelar</button>
                <button class="btn btn-add">Salvar Nota</button>
            </div>
        </div>
    </div>
</body>
</html>
