<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Sistema de Notas Fiscais</title>
    <style>
        body { font-family: sans-serif; background-color: #f7f7f7; padding: 20px; color: #333; }
        .container { max-width: 1400px; margin: auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .btn { padding: 10px 15px; border-radius: 5px; border: 1px solid #ccc; cursor: pointer; font-weight: bold; }
        .btn-add { background-color: #215598; color: white; border: none; }
        .filters { background: white; padding: 20px; border-radius: 5px; border: 1px solid #e0e0e0; margin-bottom: 20px; }
        .filter-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
        table { width: 100%; border-collapse: collapse; background: white; border: 1px solid #e0e0e0; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #eee; font-size: 13px; }
        .modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.5); justify-content:center; align-items:center; }
        .modal-content { background: white; padding: 20px; border-radius: 5px; width: 400px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📋 Notas Fiscais</h1>
            <div>
                <button class="btn" onclick="window.print()">📄 Gerar PDF</button>
                <button class="btn btn-add" onclick="openModal()">+ Nova Nota Fiscal</button>
            </div>
        </div>

        <div class="filters">
            <div class="filter-grid">
                <input type="text" id="fFornecedor" placeholder="Fornecedor" onkeyup="filterTable()">
                <input type="text" id="fNF" placeholder="Número NF" onkeyup="filterTable()">
                <select id="fStatus" onchange="filterTable()"><option value="">Todos Status</option><option>Acatada</option><option>Não Acatada</option></select>
            </div>
        </div>

        <table id="tblNotas">
            <thead>
                <tr>
                    <th>Data</th><th>Fornecedor</th><th>NF</th><th>Valor</th><th>Chegada</th>
                    <th>Saída</th><th>Temp.</th><th>Conferente</th><th>Prevenção</th><th>Status</th><th>Obs</th><th>Ações</th>
                </tr>
            </thead>
            <tbody id="tbodyNotas"></tbody>
        </table>
    </div>

    <div id="modal" class="modal">
        <div class="modal-content">
            <h3 id="modalTitle">Nova Nota Fiscal</h3>
            <input type="hidden" id="editIndex">
            <input type="text" id="inData" placeholder="Data (AAAA-MM-DD)" style="width:100%; margin-bottom:5px;">
            <input type="text" id="inFornecedor" placeholder="Fornecedor" style="width:100%; margin-bottom:5px;">
            <input type="text" id="inNF" placeholder="NF" style="width:100%; margin-bottom:5px;">
            <input type="text" id="inValor" placeholder="Valor" style="width:100%; margin-bottom:5px;">
            <select id="inStatus" style="width:100%; margin-bottom:10px;"><option>Acatada</option><option>Não Acatada</option></select>
            <button class="btn btn-add" onclick="saveNota()">Salvar</button>
            <button class="btn" onclick="closeModal()">Cancelar</button>
        </div>
    </div>

    <script>
        let notas = JSON.parse(localStorage.getItem('notas')) || [];

        function renderTable(data = notas) {
            const tbody = document.getElementById('tbodyNotas');
            tbody.innerHTML = '';
            data.forEach((n, i) => {
                tbody.innerHTML += `<tr>
                    <td>${n.data}</td><td>${n.fornecedor}</td><td>${n.nf}</td><td>${n.valor}</td>
                    <td>${n.chegada}</td><td>${n.saida}</td><td>${n.temp}</td><td>${n.conferente}</td><td>${n.prev}</td>
                    <td>${n.status}</td><td>${n.obs}</td>
                    <td><button onclick="editNota(${i})">✏️</button> <button onclick="delNota(${i})">🗑️</button></td>
                </tr>`;
            });
        }

        function saveNota() {
            const index = document.getElementById('editIndex').value;
            const novaNota = {
                data: document.getElementById('inData').value,
                fornecedor: document.getElementById('inFornecedor').value,
                nf: document.getElementById('inNF').value,
                valor: document.getElementById('inValor').value,
                status: document.getElementById('inStatus').value,
                chegada: '-', saida: '-', temp: '-', conferente: '-', prev: '-', obs: '-'
            };
            if(index === "") notas.push(novaNota);
            else notas[index] = novaNota;
            localStorage.setItem('notas', JSON.stringify(notas));
            closeModal(); renderTable();
        }

        function delNota(i) { if(confirm("Excluir?")) { notas.splice(i, 1); localStorage.setItem('notas', JSON.stringify(notas)); renderTable(); } }
        function editNota(i) { document.getElementById('editIndex').value = i; openModal(); }
        function openModal() { document.getElementById('modal').style.display = 'flex'; }
        function closeModal() { document.getElementById('modal').style.display = 'none'; document.getElementById('editIndex').value = ""; }
        function filterTable() {
            const fFornecedor = document.getElementById('fFornecedor').value.toLowerCase();
            const filtered = notas.filter(n => n.fornecedor.toLowerCase().includes(fFornecedor));
            renderTable(filtered);
        }
        renderTable();
    </script>
</body>
</html>
