<script>
    const URL_GOOGLE = 'https://script.google.com/macros/s/AKfycbxKDQUlKaYGv8IkOjELuzyzXKudWypBml3pbT69xMWzCo7kWgquPA4bNukTi0swq1uj/exec'; 
    let notas = [];

    async function renderizar() {
        const response = await fetch(URL_GOOGLE);
        const dados = await response.json();
        
        // Pula o cabeçalho
        let listaNotas = dados.slice(1);
        
        // Mapeia adicionando o ID (que é o índice + 1, pois pulamos a linha 1)
        notas = listaNotas.map((n, index) => ({
            id: index + 2, // Linha real na planilha
            data: n[0], fornecedor: n[1], nf: n[2], valor: n[3], chegada: n[4], saida: n[5], temp: n[6], conferente: n[7], prev: n[8], status: n[9]
        }));

        // Inverte para exibir do mais novo para o mais velho
        let exibicao = [...notas].reverse();

        const fStatus = document.getElementById('fStatus').value;
        const fForn = document.getElementById('fFornecedor').value.toLowerCase();
        const fNF = document.getElementById('fNF').value;
        const tbody = document.getElementById('corpoTabela');
        const mobile = document.getElementById('corpoMobile');
        tbody.innerHTML = ''; mobile.innerHTML = '';
        let totalV = 0, cat = 0, naoCat = 0;
        
        exibicao.forEach(n => {
            if ((fStatus === "Todos" || n.status === fStatus) && n.fornecedor.toLowerCase().includes(fForn) && n.nf.includes(fNF)) {
                const statusClass = n.status === 'ACATADA' ? 'status-acatada' : 'status-nao-acatada';
                // Adicionando os botões de ação novamente
                const acoes = `<button onclick="abrirModal(${n.id})">✏️</button> <button onclick="excluir(${n.id})">🗑️</button>`;
                
                tbody.innerHTML += `<tr><td>${n.data}</td><td>${n.fornecedor}</td><td>${n.nf}</td><td>R$ ${n.valor}</td><td>${n.chegada}</td><td>${n.saida}</td><td>${n.temp}</td><td>${n.conferente}</td><td>${n.prev}</td><td class="${statusClass}">${n.status}</td><td>${acoes}</td></tr>`;
                mobile.innerHTML += `<div class="card-mobile"><div class="card-header-mobile"><span>NF: ${n.nf}</span><span class="${statusClass}">${n.status}</span></div><div class="card-body-mobile"><div>📅 ${n.data} | 🏢 ${n.fornecedor}</div><div>💰 R$ ${n.valor}</div><div>⏱️ ${n.chegada}-${n.saida} | 🌡️ ${n.temp}</div></div><div class="card-actions-mobile">${acoes}</div></div>`;
                totalV += parseFloat(n.valor) || 0; 
                n.status === 'ACATADA' ? cat++ : naoCat++;
            }
        });
        document.getElementById('totalNotas').innerText = notas.length;
        document.getElementById('valorTotal').innerText = `R$ ${totalV.toFixed(2)}`;
        document.getElementById('acatadas').innerText = cat;
        document.getElementById('naoAcatadas').innerText = naoCat;
    }

    // Funções de Ação
    async function excluir(id) {
        if(!confirm("Excluir esta nota?")) return;
        await fetch(URL_GOOGLE + "?deletar=" + id); // Requer ajuste no Apps Script
        renderizar();
    }

    function abrirModal(id = null) {
        document.getElementById('modal').style.display = 'flex';
        // Se id for passado, preenche os campos com os dados da nota correspondente
    }

    function fecharModal() { document.getElementById('modal').style.display = 'none'; }
    
    // ... restante da função salvarNota ...
    renderizar();
</script>
