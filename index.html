<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notas Fiscais</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f7f7f7; padding: 15px; color: #333; margin: 0; }
        .container { max-width: 1400px; margin: auto; padding-bottom: 30px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; gap: 10px; }
        .header-main { display: flex; flex-direction: column; }
        .header h1 { font-size: 1.1rem; margin: 0; }
        .subtitle { font-size: 0.85rem; color: #555; margin: 5px 0 0 0; font-weight: normal; }
        
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 15px; }
        .card { background: white; padding: 12px; border-radius: 8px; border: 1px solid #e0e0e0; }
        .card small { font-size: 10px; color: #888; text-transform: uppercase; font-weight: bold; }
        .card h2 { margin: 4px 0 0 0; font-size: 18px; }
        
        .filters { background: white; padding: 15px; border-radius: 8px; border: 1px solid #e0e0e0; margin-bottom: 15px; }
        .filter-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
        
        table { width: 100%; border-collapse: collapse; background: white; border: 1px solid #e0e0e0; }
        th, td { padding: 8px 5px; text-align: left; border-bottom: 1px solid #eee; font-size: 12px; }
        th { background-color: #215598; color: white; }
        
        .status-badge { padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: bold; text-transform: uppercase; display: inline-block; }
        .status-acatada { color: green; background-color: #e8f5e9; }
        .status-nao-acatada { color: red; background-color: #ffebee; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: white; padding: 25px; border-radius: 8px; width: 600px; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        input, select { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; margin-top: 5px; }
        .btn { padding: 8px 12px; border-radius: 4px; border: none; cursor: pointer; font-weight: bold; font-size: 12px; }
        .btn-add { background-color: #215598; color: white; }
        
        #corpoMobile { display: none; }
        .card-mobile { background: white; border: 1px solid #e0e0e0; padding: 16px; border-radius: 12px; margin-bottom: 12px; }
        .card-header-mobile { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .card-title { font-size: 16px; font-weight: bold; margin: 0; }
        .card-nf { font-size: 13px; color: #666; margin-top: 2px; }
        .card-body-mobile { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; font-size: 13px; margin-top: 10px; padding-top: 10px; border-top: 1px solid #f0f0f0; }
        .label-mobile { color: #888; font-size: 11px; text-transform: uppercase; font-weight: bold; display: block; }
        .value-mobile { font-weight: 500; color: #333; }

        /* Estilo do Rodapé */
        .footer { text-align: center; margin-top: 25px; padding-top: 15px; border-top: 1px solid #e0e0e0; font-size: 11px; color: #777; }

        @media print { 
            .header, .stats-grid, .filters, .btn, .card-mobile, .footer { display: none !important; } 
            body { background: white; padding: 0; margin: 0; } 
            .container { width: 100%; padding: 0; margin: 0; } 
            table { display: table !important; width: 100%; border-collapse: collapse; font-size: 10px; } 
            th, td { border: 1px solid #ddd; padding: 4px 3px !important; } 
            th { background-color: #215598 !important; color: white !important; -webkit-print-color-adjust: exact; } 
            .status-badge { color: inherit; background-color: transparent; border: 1px solid #999; padding: 1px 3px; font-size: 9px; } 
            .status-acatada { color: green !important; -webkit-print-color-adjust: exact; } 
            .status-nao-acatada { color: red !important; -webkit-print-color-adjust: exact; } 
        }
        
        @media (max-width: 768px) { 
            table { display: none; } 
            #corpoMobile { display: block; } 
            .filter-grid { grid-template-columns: 1fr; gap: 8px; } 
            .filter-grid input, .filter-grid select { padding: 12px; font-size: 16px; width: 100%; -webkit-appearance: none; appearance: none; border: 1px solid #ccc; border-radius: 4px; background-color: white; }
            input[type="date"] { display: block; min-height: 44px; }
            .stats-grid { grid-template-columns: 1fr 1fr; } 
            .header { flex-direction: column; align-items: flex-start; } 
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-main">
                <h1>📋 CONTROLE DE NFs. e TEMPERATURA°C</h1>
                <p class="subtitle">Resfriados: 0°C a 15°C / Congelados: -18°C a -22°C</p>
            </div>
            <div class="header-actions">
                <button class="btn" onclick="window.print()">Gerar PDF/Salvar</button>
                <button class="btn btn-add" onclick="abrirModal()">+ Nova Nota Fiscal</button>
            </div>
        </div>
        <div class="stats-grid">
            <div class="card"><small>TOTAL</small><h2 id="totalNotas">0</h2></div>
            <div class="card"><small>VALOR</small><h2 id="valorTotal">R$ 0,00</h2></div>
            <div class="card"><small>NÃO ACATADA</small><h2 id="naoAcatadas" class="status-badge status-nao-acatada" style="margin-top: 10px;">0</h2></div>
            <div class="card"><small>ACATADAS</small><h2 id="acatadas" class="status-badge status-acatada" style="margin-top: 10px;">0</h2></div>
        </div>
        <div class="filters">
            <div class="filter-grid">
                <input type="date" id="fData" onchange="renderizar()">
                <select id="fStatus" onchange="renderizar()"><option value="Todos">Status: Todos</option><option value="ACATADA">ACATADA</option><option value="NÃO ACATADA">NÃO ACATADA</option></select>
                <input type="text" id="fFornecedor" placeholder="Fornecedor (use ; para vários)" onkeyup="renderizar()">
                <input type="text" id="fNF" placeholder="Buscar NF" onkeyup="renderizar()">
            </div>
        </div>
        <table>
            <thead><tr><th>Data</th><th>Fornecedor</th><th>NF</th><th>Valor</th><th>Chegada</th><th>Saída</th><th>Temp.</th><th>Conferente</th><th>Prevenção</th><th>Status</th><th>Ações</th></tr></thead>
            <tbody id="corpoTabela"></tbody>
        </table>
        <div id="corpoMobile"></div>

        <!-- Rodapé com indicação de versão -->
        <footer class="footer">
            Versão: 26.07.01
        </footer>
    </div>

    <!-- Modal -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <h3>Nova Nota Fiscal</h3>
            <form id="formNota">
                <div class="form-grid">
                    <div><label>Data</label><input type="date" id="data" required></div>
                    <div><label>Fornecedor</label><input type="text" id="fornecedor" required></div>
                    <div><label>NF</label><input type="text" id="nf" required></div>
                    <!-- Alterado para type="text" com inputmask em JS -->
                    <div><label>Valor (R$)</label><input type="text" id="valor" placeholder="0,00" required oninput="mascaraMoeda(this)"></div>
                    <div><label>Chegada</label><input type="time" id="chegada"></div>
                    <div><label>Saída</label><input type="time" id="saida"></div>
                    <div><label>Temp.</label><input type="text" id="temp"></div>
                    <div><label>Conferente</label><input type="text" id="conferente"></div>
                    <div><label>Prevenção</label><input type="text" id="prev"></div>
                    <div><label>Status</label><select id="status"><option>NÃO ACATADA</option><option>ACATADA</option></select></div>
                </div>
            </form>
            <div style="margin-top: 20px; text-align: right;">
                <button class="btn" onclick="fecharModal()">Cancelar</button>
                <button class="btn btn-add" onclick="salvarNota()">Salvar</button>
            </div>
        </div>
    </div>

    <script>
        const URL_GOOGLE = 'https://script.google.com/macros/s/AKfycbxJNhi1AY83G_AFdS1psw9g8wFe2BLS_AFU-8tZetXkMaTRnO81G5HV6RF1udYIrpBw/exec'; 

        function formatarMoeda(valor) {
            return Number(valor).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
        }

        // Função que aplica a máscara de moeda enquanto digita
        function mascaraMoeda(i) {
            let v = i.value.replace(/\D/g, '');
            v = (v / 100).toFixed(2) + '';
            v = v.replace(".", ",");
            v = v.replace(/\B(?=(\d{3})+(?!\d))/g, ".");
            i.value = v;
        }

        async function renderizar() {
            try {
                const response = await fetch(URL_GOOGLE);
                const dados = await response.json();
                let listaNotas = dados.slice(1).reverse();
                let notas = listaNotas.map(n => ({
                    data: n[0], fornecedor: n[1], nf: String(n[2] || ""), valor: n[3], 
                    chegada: n[4], saida: n[5], temp: n[6], conferente: n[7], prev: n[8], status: n[9]
                }));

                const fData = document.getElementById('fData').value;
                const fStatus = document.getElementById('fStatus').value;
                const fFornInput = document.getElementById('fFornecedor').value.toUpperCase();
                const fFornArray = fFornInput.split(';').map(item => item.trim()).filter(item => item !== "");
                const fNF = document.getElementById('fNF').value.toUpperCase();
                const tbody = document.getElementById('corpoTabela');
                const mobile = document.getElementById('corpoMobile');
                
                tbody.innerHTML = ''; 
                mobile.innerHTML = '';
                
                let totalV = 0, cat = 0, naoCat = 0;
                
                notas.forEach(n => {
                    const fornecedorUpper = (n.fornecedor || "").toUpperCase();
                    const nfUpper = (n.nf || "").toUpperCase();
                    const atendeFornecedor = fFornArray.length === 0 || fFornArray.some(termo => fornecedorUpper.includes(termo));

                    if ((fData === "" || n.data === fData) &&
                        (fStatus === "Todos" || n.status === fStatus) && 
                        atendeFornecedor && 
                        nfUpper.includes(fNF)) {
                        
                        const statusClass = n.status === 'ACATADA' ? 'status-acatada' : 'status-nao-acatada';
                        const valorFormatado = formatarMoeda(n.valor);

                        tbody.innerHTML += `<tr><td>${n.data}</td><td>${n.fornecedor}</td><td>${n.nf}</td><td>${valorFormatado}</td><td>${n.chegada}</td><td>${n.saida}</td><td>${n.temp}</td><td>${n.conferente}</td><td>${n.prev}</td><td><span class="status-badge ${statusClass}">${n.status}</span></td><td>-</td></tr>`;
                        
                        mobile.innerHTML += `
                        <div class="card-mobile">
                            <div class="card-header-mobile">
                                <div>
                                    <div class="card-title">${n.fornecedor}</div>
                                    <div class="card-nf">NF ${n.nf}</div>
                                </div>
                                <span class="status-badge ${statusClass}">${n.status}</span>
                            </div>
                            <div class="card-body-mobile">
                                <div><span class="label-mobile">Data</span><span class="value-mobile">${n.data}</span></div>
                                <div><span class="label-mobile">Valor</span><span class="value-mobile">${valorFormatado}</span></div>
                                <div><span class="label-mobile">Chegada</span><span class="value-mobile">${n.chegada}</span></div>
                                <div><span class="label-mobile">Saída</span><span class="value-mobile">${n.saida}</span></div>
                            </div>
                        </div>`;
                        
                        totalV += parseFloat(n.valor) || 0; 
                        n.status === 'ACATADA' ? cat++ : naoCat++;
                    }
                });
                document.getElementById('totalNotas').innerText = notas.length;
                document.getElementById('valorTotal').innerText = formatarMoeda(totalV);
                document.getElementById('acatadas').innerText = cat;
                document.getElementById('naoAcatadas').innerText = naoCat;
            } catch (error) { console.error("Erro ao renderizar:", error); }
        }

        async function salvarNota() {
            const btnSalvar = document.querySelector('.modal-content .btn-add');
            btnSalvar.disabled = true;
            btnSalvar.style.opacity = '0.6';

            const nfInput = document.getElementById('nf').value.toUpperCase();

            // Verificação de duplicidade antes de enviar
            try {
                const response = await fetch(URL_GOOGLE);
                const dados = await response.json();
                const listaNotas = dados.slice(1);
                
                const duplicada = listaNotas.some(n => String(n[2]).toUpperCase() === nfInput);
                
                if (duplicada) {
                    alert("Atenção: Esta Nota Fiscal já foi cadastrada!");
                    btnSalvar.disabled = false;
                    btnSalvar.style.opacity = '1';
                    return; 
                }
            } catch (e) {
                console.error("Erro ao validar duplicidade:", e);
            }

            // Converter o valor mascarado (ex: "1.234,56") para formato numérico americano correto ("1234.56") para salvar na planilha
            const valorFormatadoInput = document.getElementById('valor').value;
            const valorNumerico = valorFormatadoInput.replace(/\./g, '').replace(',', '.');

            const nota = {
                data: "'" + document.getElementById('data').value,
                fornecedor: document.getElementById('fornecedor').value.toUpperCase(),
                nf: nfInput,
                valor: valorNumerico,
                chegada: "'" + document.getElementById('chegada').value,
                saida: "'" + document.getElementById('saida').value,
                temp: document.getElementById('temp').value.toUpperCase(),
                conferente: document.getElementById('conferente').value.toUpperCase(),
                prev: document.getElementById('prev').value.toUpperCase(),
                status: document.getElementById('status').value
            };
            
            try {
                await fetch(URL_GOOGLE, { method: 'POST', mode: 'no-cors', body: JSON.stringify(nota) });
                document.getElementById('formNota').reset();
                fecharModal();
                setTimeout(renderizar, 1500);
            } catch (err) {
                console.error("Erro ao salvar:", err);
            } finally {
                btnSalvar.disabled = false;
                btnSalvar.style.opacity = '1';
            }
        }

        function abrirModal() { document.getElementById('modal').style.display = 'flex'; }
        function fecharModal() { document.getElementById('modal').style.display = 'none'; }
        renderizar();
    </script>
</body>
</html>
