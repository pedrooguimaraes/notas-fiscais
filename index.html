<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notas Fiscais App</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-4">

    <div class="max-w-4xl mx-auto">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-bold">Gestão de Notas</h1>
            <button onclick="abrirModal()" class="bg-blue-600 text-white px-4 py-2 rounded">Nova Nota</button>
        </div>

        <div class="bg-white shadow rounded overflow-x-auto">
            <table class="w-full text-left">
                <thead class="bg-gray-50 border-b">
                    <tr>
                        <th class="p-3">Data</th>
                        <th class="p-3">Fornecedor</th>
                        <th class="p-3">NF</th>
                        <th class="p-3">Valor</th>
                        <th class="p-3">Status</th>
                    </tr>
                </thead>
                <tbody id="tabela-corpo" class="divide-y">
                    <tr><td colspan="5" class="p-4 text-center">Carregando dados...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- MODAL -->
    <div id="modal-nf" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4">
        <div class="bg-white p-6 rounded shadow-lg w-full max-w-sm">
            <h2 class="text-lg font-bold mb-4">Registrar Nota</h2>
            <form id="form-nf">
                <input type="date" id="m-data" class="w-full border p-2 mb-2" required>
                <input type="text" id="m-fornecedor" placeholder="Fornecedor" class="w-full border p-2 mb-2" required>
                <input type="text" id="m-nf" placeholder="Número NF" class="w-full border p-2 mb-2" required>
                <input type="number" id="m-valor" placeholder="Valor" class="w-full border p-2 mb-2" required>
                <select id="m-status" class="w-full border p-2 mb-4">
                    <option value="ACATADA">Acatada</option>
                    <option value="NÃO ACATADA">Não Acatada</option>
                </select>
                <div class="flex justify-end gap-2">
                    <button type="button" onclick="fecharModal()" class="px-4 py-2 bg-gray-300 rounded">Cancelar</button>
                    <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded">Salvar</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzVqJ6ptOTzAJhDfucvI0NW4VhwpcrIi71QQRNzfwb40LRJPYXrfKnkJyul54V1RdJM/exec';

        // Carregar dados
        function carregarDados() {
            fetch(SCRIPT_URL)
                .then(res => res.json())
                .then(data => {
                    const corpo = document.getElementById('tabela-corpo');
                    corpo.innerHTML = data.map(item => `
                        <tr>
                            <td class="p-3">${item.Data}</td>
                            <td class="p-3">${item.Fornecedor}</td>
                            <td class="p-3">${item.NF}</td>
                            <td class="p-3">R$ ${item.Valor}</td>
                            <td class="p-3">${item.Status}</td>
                        </tr>
                    `).join('');
                })
                .catch(err => console.error("Erro ao carregar:", err));
        }

        // Salvar dados
        document.getElementById('form-nf').onsubmit = function(e) {
            e.preventDefault();
            const payload = {
                Data: document.getElementById('m-data').value,
                Fornecedor: document.getElementById('m-fornecedor').value,
                NF: document.getElementById('m-nf').value,
                Valor: document.getElementById('m-valor').value,
                Status: document.getElementById('m-status').value
            };

            fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors', // Importante para Google Apps Script
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(() => {
                fecharModal();
                carregarDados();
            })
            .catch(err => alert("Erro ao salvar: " + err));
        };

        function abrirModal() { document.getElementById('modal-nf').classList.remove('hidden'); }
        function fecharModal() { document.getElementById('modal-nf').classList.add('hidden'); }

        window.onload = carregarDados;
    </script>
</body>
</html>
