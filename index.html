<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Notas Fiscais</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @media (max-width: 1024px) {
            .hide-on-mobile { display: none; }
            .show-on-mobile { display: block; }
        }
        @media (min-width: 1025px) {
            .show-on-mobile { display: none; }
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 font-sans p-4">

    <!-- [CONTEÚDO DO SEU HEADER, MÉTRICAS, FILTROS E MODAL AQUI] -->
    <!-- (Assumindo a estrutura que você enviou na Parte 1) -->

    <div class="overflow-x-auto bg-white rounded-lg shadow hide-on-mobile">
        <table class="w-full text-sm text-left">
            <thead class="bg-gray-100 uppercase text-xs font-semibold text-gray-600">
                <tr>
                    <th class="py-3 px-4">Data</th>
                    <th class="py-3 px-4">Fornecedor</th>
                    <th class="py-3 px-4">NF</th>
                    <th class="py-3 px-4">Valor</th>
                    <th class="py-3 px-4">Chegada</th>
                    <th class="py-3 px-4">Saída</th>
                    <th class="py-3 px-4">Temp</th>
                    <th class="py-3 px-4">Conf.</th>
                    <th class="py-3 px-4">Prev.</th>
                    <th class="py-3 px-4">Status</th>
                    <th class="py-3 px-4">Obs</th>
                    <th class="py-3 px-4">Ações</th>
                </tr>
            </thead>
            <tbody id="tabela-corpo"></tbody>
        </table>
    </div>

    <!-- Container dos Cards Mobile -->
    <div id="cards-container" class="show-on-mobile space-y-4"></div>

    <script>
        const SHEETDB_URL = 'https://sheetdb.io/api/v1/h5ssgqcelrexs';
        let notas = [];

        function buscarNotasDoBanco() {
            fetch(SHEETDB_URL)
                .then(response => response.json())
                .then(dados => {
                    notas = dados.map(item => {
                        let valorCru = item.Valor ? item.Valor.toString().replace('R$', '').replace(/\s/g, '').replace(/\./g, '').replace(',', '.') : '0';
                        return {
                            id: item.id || (Date.now() + Math.random()),
                            data: item.Data || '',
                            fornecedor: item.Fornecedor || '',
                            nf: item.NF || '',
                            valor: parseFloat(valorCru) || 0,
                            chegada: item.Chegada || '-',
                            saida: item.Saída || item.Saida || '-',
                            temp: item.Temp || '-',
                            conferente: item.Conferente || '-',
                            prevencao: item.Prevenção || item.Prevencao || '-',
                            status: (item.Status || 'NÃO ACATADA').toUpperCase(),
                            observacao: item.Observação || item.Observacao || '-'
                        };
                    });
                    renderizarTabela();
                });
        }

        function renderizarTabela() {
            const corpo = document.getElementById('tabela-corpo');
            const containerCards = document.getElementById('cards-container');
            corpo.innerHTML = "";
            containerCards.innerHTML = "";
            
            let filtrados = obterFiltrados();
            let totalValor = 0;
            let naoAcatadas = 0;
            let acatadas = 0;

            filtrados.forEach(n => {
                totalValor += n.valor;
                if (n.status === "ACATADA") acatadas++; else naoAcatadas++;
            });

            [...filtrados].reverse().forEach(nota => {
                const statusClass = nota.status === "ACATADA" ? "bg-green-50 text-green-700 border-green-200" : "bg-[#ffebeb] text-[#ca3e3e] border-[#ffd1d1]";
                
                // Render Tabela
                const tr = document.createElement('tr');
                tr.innerHTML = `...`; // (Seu código original da linha da tabela)
                corpo.appendChild(tr);

                // Render Cards Mobile
                const card = document.createElement('div');
                card.className = "bg-white p-4 rounded-lg shadow border-l-4 " + (nota.status === "ACATADA" ? "border-green-500" : "border-red-500");
                card.innerHTML = `
                    <div class="flex justify-between items-start">
                        <span class="font-bold text-lg">${nota.fornecedor}</span>
                        <span class="${statusClass} text-[10px] px-2 py-1 rounded font-bold">${nota.status}</span>
                    </div>
                    <p class="text-sm">NF: ${nota.nf} | R$ ${nota.valor.toFixed(2)}</p>
                    <div class="mt-2 text-xs text-gray-500 grid grid-cols-2 gap-2">
                        <span>Data: ${nota.data}</span>
                        <span>Temp: ${nota.temp}</span>
                    </div>
                    <div class="mt-3 flex gap-2">
                        <button onclick="abrirModal('${nota.id}')" class="flex-1 bg-gray-100 py-1 rounded text-xs font-bold">Editar</button>
                        <button onclick="excluirNota('${nota.id}')" class="flex-1 bg-red-50 text-red-600 py-1 rounded text-xs font-bold">Excluir</button>
                    </div>
                `;
                containerCards.appendChild(card);
            });

            // Atualização de métricas (código original que você enviou)...
        }

        // Funções de abrirModal, salvarNota, excluirNota, etc...
        window.onload = buscarNotasDoBanco;
    </script>
</body>
</html>
