<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Sistema de Notas Fiscais</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f7f7f7; padding: 20px; color: #333; }
        .container { max-width: 1400px; margin: auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .btn { padding: 10px 15px; border-radius: 5px; border: 1px solid #ccc; cursor: pointer; font-weight: bold; }
        .btn-add { background-color: #215598; color: white; border: none; }
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 20px; }
        .card { background: white; padding: 20px; border-radius: 5px; border: 1px solid #e0e0e0; }
        .filters { background: white; padding: 20px; border-radius: 5px; border: 1px solid #e0e0e0; margin-bottom: 20px; }
        .filter-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 15px; margin-top: 10px; }
        input, select { padding: 8px; border: 1px solid #ccc; border-radius: 4px; width: 100%; }
        table { width: 100%; border-collapse: collapse; background: white; border: 1px solid #e0e0e0; }
        th { text-align: left; padding: 15px; font-size: 13px; color: #555; border-bottom: 1px solid #e0e0e0; }
        td { padding: 15px; font-size: 13px; border-bottom: 1px solid #eee; }
        .status-tag { background: #fee; color: #b71c1c; padding: 3px 8px; border-radius: 4px; font-weight: bold; font-size: 11px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div><h1>📋 Notas Fiscais</h1><p>Gerenciamento de recebimento</p></div>
            <div>
                <button class="btn" onclick="window.print()">📄 Gerar Relatório / PDF</button>
                <button class="btn btn-add" onclick="showModal()">+ Nova Nota Fiscal</button>
            </div>
        </div>
        <div class="filters">
            <strong>▼ Filtros de Busca</strong>
            <div class="filter-grid">
                <select id="fStatus"><option value="">Todos Status</option><option>Acatada</option><option>Não Acatada</option></select>
                <input type="text" id="fData" placeholder="Data (AAAA-MM-DD)">
                <input type="text" id="fFornecedor" placeholder="Fornecedor...">
                <input type="text" id="fNF" placeholder="Número NF...">
                <button class="btn" onclick="applyFilters()">🔍 Filtrar</button>
            </div>
        </div>
        <table id="tableNF">
            <thead>
                <tr><th>Data</th><th>Fornecedor</th><th>NF</th><th>Valor</th><th>Status</th><th>Ações</th></tr>
            </thead>
            <tbody id="tbodyNF"></tbody>
        </table>
    </div>

    <script>
        let notas = JSON.parse(localStorage.getItem('notas')) || [];

        function renderTable(data = notas) {
            const tbody = document.getElementById('tbodyNF');
            tbody.innerHTML = '';
            data.forEach((n, index) => {
                tbody.innerHTML += `<tr>
                    <td>${n.data}</td><td>${n.fornecedor}</td><td>${n.nf}</td><td>${n.valor}</td>
                    <td><span class="status-tag">${n.status}</span></td>
                    <td><button onclick="editNF(${index})">✏️</button> <button onclick="deleteNF(${index})">🗑️</button></td>
                </tr>`;
            });
        }

        function showModal() {
            const fornecedor = prompt("Fornecedor:");
            if (fornecedor) {
                notas.push({data: '2026-07-14', fornecedor, nf: '000', valor: 'R$ 0,00', status: 'Não Acatada'});
                localStorage.setItem('notas', JSON.stringify(notas));
                renderTable();
            }
        }

        function deleteNF(index) {
            if(confirm("Excluir?")) {
                notas.splice(index, 1);
                localStorage.setItem('notas', JSON.stringify(notas));
                renderTable();
            }
        }

        function applyFilters() {
            const fStatus = document.getElementById('fStatus').value;
            const filtered = notas.filter(n => !fStatus || n.status === fStatus);
            renderTable(filtered);
        }

        renderTable();
    </script>
</body>
</html>
