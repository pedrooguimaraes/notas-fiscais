<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notas Fiscais - Sistema Híbrido</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: sans-serif; background-color: #f8fafc; }
        .custom-card { background-color: #ffffff; border: 1px solid #e2e8f0; border-radius: 12px; }
        .table-container { overflow-x: auto; }
    </style>
</head>
<body class="p-3">
    <div class="max-w-[1500px] mx-auto space-y-6">
        <h1 class="text-2xl font-bold">Notas Fiscais</h1>
        <button onclick="abrirModal()" class="bg-[#1e5bb9] text-white px-4 py-2 rounded-lg">+ Nova Nota</button>
        
        <div class="table-container custom-card">
            <table class="w-full text-left">
                <thead><tr class="bg-slate-50 border-b">
                    <th class="p-3">Data</th><th class="p-3">Fornecedor</th><th class="p-3">NF</th><th class="p-3">Status</th><th class="p-3 text-center">Ações</th>
                </tr></thead>
                <tbody id="tabela-desktop"></tbody>
            </table>
        </div>
    </div>

    <!-- MODAL -->
    <div id="modal-nf" class="hidden fixed inset-0 bg-slate-900/60 flex items-center justify-center p-4">
        <form id="form-nf" onsubmit="salvarNota(event)" class="bg-white p-6 rounded-xl w-full max-w-lg">
            <input type="hidden" id="f-id">
            <input type="date" id="f-data" required class="w-full border p-2 mb-2">
            <input type="text" id="f-fornecedor" placeholder="Fornecedor" required class="w-full border p-2 mb-2">
            <input type="text" id="f-nf" placeholder="Número NF" required class="w-full border p-2 mb-2">
            <select id="f-status" class="w-full border p-2 mb-4">
                <option value="ACATADA">ACATADA</option>
                <option value="NÃO ACATADA">NÃO ACATADA</option>
            </select>
            <button type="submit" class="bg-blue-600 text-white w-full py-2 rounded">Salvar</button>
            <button type="button" onclick="fecharModal()" class="w-full mt-2 text-slate-500">Cancelar</button>
        </form>
    </div>

    <script>
        const URL_API = 'https://script.google.com/macros/s/AKfycbwR9qjtnWpzyNUj4ahovT0Hi3T86852_qMlr_UUm2Wpyae0J66nNpLvLY3P0bFSJhic/exec';

        function buscarNotas() {
            fetch(URL_API).then(r => r.json()).then(dados => {
                const tbody = document.getElementById('tabela-desktop');
                tbody.innerHTML = dados.map(n => `
                    <tr class="border-b">
                        <td class="p-3">${n.Data}</td>
                        <td class="p-3">${n.Fornecedor}</td>
                        <td class="p-3">${n.NF}</td>
                        <td class="p-3">${n.Status}</td>
                        <td class="p-3 text-center">
                            <button onclick="excluirNota('${n.id}')" class="text-red-500">Excluir</button>
                        </td>
                    </tr>
                `).join('');
            });
        }

        function salvarNota(e) {
            e.preventDefault();
            const data = {
                id: document.getElementById('f-id').value || Date.now().toString(),
                Data: document.getElementById('f-data').value,
                Fornecedor: document.getElementById('f-fornecedor').value,
                NF: document.getElementById('f-nf').value,
                Status: document.getElementById('f-status').value
            };
            fetch(URL_API, { method: 'POST', body: JSON.stringify(data) }).then(() => {
                fecharModal();
                buscarNotas();
            });
        }

        function excluirNota(id) {
            if(confirm('Excluir?')) {
                fetch(URL_API + '?id=' + id, { method: 'DELETE' }).then(() => buscarNotas());
            }
        }

        function abrirModal() { document.getElementById('modal-nf').classList.remove('hidden'); }
        function fecharModal() { document.getElementById('modal-nf').classList.add('hidden'); }
        window.onload = buscarNotas;
    </script>
</body>
</html>
