<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Sistema de Notas Fiscais</title>
    <style>
        body { font-family: sans-serif; background-color: #f7f7f7; padding: 20px; color: #333; }
        .container { max-width: 1400px; margin: auto; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 25px; border-radius: 8px; width: 600px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .full-width { grid-column: span 2; }
        input, select, textarea { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; margin-top: 5px; }
        .btn { padding: 10px 20px; border-radius: 4px; border: none; cursor: pointer; font-weight: bold; }
        .btn-add { background-color: #215598; color: white; }
        .btn-cancel { background-color: #eee; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📋 Notas Fiscais</h1>
        <button class="btn btn-add" onclick="document.getElementById('modal').style.display='flex'">+ Nova Nota Fiscal</button>
    </div>

    <div id="modal" class="modal">
        <div class="modal-content">
            <h3>Nova Nota Fiscal</h3>
            <div class="form-grid">
                <div><label>Data</label><input type="date"></div>
                <div><label>Fornecedor</label><input type="text"></div>
                <div><label>Número da NF</label><input type="text"></div>
                <div><label>Valor (R$)</label><input type="text"></div>
                <div><label>Horário Chegada</label><input type="time"></div>
                <div><label>Horário Saída</label><input type="time"></div>
                <div><label>Temp.</label><input type="text"></div>
                <div><label>Conferente</label><input type="text"></div>
                <div><label>Prevenção</label><input type="text"></div>
                <div><label>Status</label><select><option>Não Acatada</option><option>Acatada</option></select></div>
                <div class="full-width"><label>Observação</label><textarea></textarea></div>
            </div>
            <div style="margin-top: 20px; text-align: right;">
                <button class="btn btn-cancel" onclick="document.getElementById('modal').style.display='none'">Cancelar</button>
                <button class="btn btn-add">Salvar Nota</button>
            </div>
        </div>
    </div>
</body>
</html>
