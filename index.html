<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Notas Fiscais</title>
    <style>
        body { font-family: sans-serif; background-color: #f7f7f7; padding: 20px; color: #333; }
        .container { max-width: 1400px; margin: auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 20px; }
        .card { background: white; padding: 20px; border-radius: 5px; border: 1px solid #e0e0e0; }
        .filters { background: white; padding: 20px; border-radius: 5px; border: 1px solid #e0e0e0; margin-bottom: 20px; }
        .filter-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
        table { width: 100%; border-collapse: collapse; background: white; border: 1px solid #e0e0e0; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #eee; font-size: 13px; }
        .status-acatada { color: green; font-weight: bold; }
        .status-nao-acatada { color: red; font-weight: bold; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: white; padding: 25px; border-radius: 8px; width: 600px; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        input, select { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; margin-top: 5px; }
        .btn { padding: 10px 20px; border-radius: 4px; border: none; cursor: pointer; font-weight: bold; }
        .btn-add { background-color: #215598; color: white; }

        /* NOVO CSS PARA CARDS MOBILE */
        .card-mobile { display: none; background: white; border: 1px solid #e0e0e0; padding: 15px; border-radius: 8px; margin-bottom: 15px; }
        .badge-mobile { display: inline-block; padding: 3px 8px; border-radius: 4px; font-size: 10px; font-weight: bold; margin-bottom: 10px; text-transform: uppercase; }
        .bg-acatada { background: #d4edda; color: #155724; }
        .bg-nao-acatada { background: #f8d7da; color: #721c24; }
        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; font-size: 13px; color: #666; }

        @media (max-width: 768px) {
            table { display: none; }
            .card-mobile { display: block; }
            .stats-grid { grid-template-columns: 1fr 1fr; }
            .filter-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div><h1>📋 Controle de Notas Fiscais (047)</h1></div>
            <div>
                <button class="btn" onclick="window.print()">Gerar PDF</button>
                <button class="btn btn-add" onclick="abrirModal()">+ Nova</button>
            </div>
        </div>
        <div class="stats-grid">
            <div class="card"><small>TOTAL</small><h2 id="totalNotas">0</h2></div>
            <div class="card"><small>VALOR</small><h2 id="valorTotal">R$ 0</h2></div>
            <div class="card"><small>N. ACATADA</small><h2 id="naoAcatadas">0</h2></div>
            <div class="card"><small>ACATADA</small><h2 id="acatadas">0</h2></div>
        </div>
        <div class="filters">
            <div class="filter-grid">
                <select id="fStatus" onchange="renderizar()"><option value="Todos">Status: Todos</option><option value="ACATADA">ACATADA</option><option value="NÃO ACATADA">NÃO ACATADA</option></select>
                <input type="text" id="fFornecedor" placeholder="Fornecedor" onkeyup="renderizar()">
                <input type="text" id="fNF" placeholder="NF" onkeyup="renderizar()">
            </div>
        </div>
        <table>
            <thead><tr><th>Data</th><th>Fornecedor</th><th>NF</th><th>Valor</th><th>Status</th></tr></thead>
            <tbody id="corpoTabela"></tbody>
        </table>
        <div id="corpoMobile"></div>
    </div>

    <!-- Modal e Script abaixo -->
    <script>
        const URL_GOOGLE = 'https://script.google.com/macros/s/AKfycbxJNhi1AY83G_AFdS1psw9g8wFe2BLS_AFU-8tZetXkMaTRnO81G5HV6RF1udYIrpBw/exec'; 

        async function renderizar() {
            const response = await fetch(URL_GOOGLE);
            const dados = await response.json();
            const notas = dados.slice(1).reverse();
            const tbody = document.getElementById('corpoTabela');
            const mobile = document.getElementById('corpoMobile');
            tbody.innerHTML = ''; mobile.innerHTML = '';

            notas.forEach(n => {
                const status = n[9];
                const badgeClass = status === 'ACATADA' ? 'bg-acatada' : 'bg-nao-acatada';
                
                // Tabela Desktop
                tbody.innerHTML += `<tr><td>${n[0]}</td><td>${n[1]}</td><td>${n[2]}</td><td>${n[3]}</td><td class="${status === 'ACATADA' ? 'status-acatada' : 'status-nao-acatada'}">${status}</td></tr>`;
                
                // Cards Mobile
                mobile.innerHTML += `
                <div class="card-mobile">
                    <div class="badge-mobile ${badgeClass}">${status}</div>
                    <div style="font-weight: bold; font-size: 15px; margin-bottom: 10px;">${n[1]}</div>
                    <div class="info-grid">
                        <div>Data: ${n[0]}</div>
                        <div>NF: ${n[2]}</div>
                        <div>Valor: R$ ${n[3]}</div>
                        <div>H: ${n[4]} - ${n[5]}</div>
                    </div>
                </div>`;
            });
        }
        renderizar();
    </script>
</body>
</html>
