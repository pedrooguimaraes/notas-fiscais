<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notas Fiscais - Sistema Híbrido</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        const URL_API = 'https://script.google.com/macros/s/AKfycbzJbbi2nC6_f-EdyEG1naTuLsWsm6Mf8sSn44V-r8N1Kqpr_KU34Z3HWAkxAZ7IBx_k/exec';
        let notasGlobais = [];

        // 1. BUSCAR DADOS
        function buscarNotasDoBanco() {
            fetch(URL_API)
                .then(response => response.json())
                .then(dados => {
                    notasGlobais = dados.map(item => ({
                        id: item.id || Date.now().toString(),
                        data: item.Data || '',
                        fornecedor: item.Fornecedor || '',
                        nf: item.NF || '',
                        valor: parseFloat(item.Valor) || 0,
                        chegada: item.Chegada || '-',
                        saida: item.Saída || '-',
                        temp: item.Temp || '-',
                        conferente: item.Conferente || '-',
                        prevencao: item.Prevenção || '-',
                        status: (item.Status || '').toUpperCase(),
                        observacao: item.Observação || '-'
                    }));
                    aplicarFiltros();
                })
                .catch(err => { console.error(err); alert("Erro ao carregar dados."); });
        }

        // 2. SALVAR
        function salvarNota(e) {
            e.preventDefault();
            const payload = {
                id: document.getElementById('f-id').value || Date.now().toString(),
                Data: document.getElementById('f-data').value,
                Fornecedor: document.getElementById('f-fornecedor').value.toUpperCase(),
                NF: document.getElementById('f-nf').value,
                Valor: document.getElementById('f-valor').value,
                Chegada: document.getElementById('f-chegada').value,
                Saída: document.getElementById('f-saida').value,
                Temp: document.getElementById('f-temp').value,
                Conferente: document.getElementById('f-conferente').value,
                Prevenção: document.getElementById('f-prevencao').value,
                Status: document.getElementById('f-status').value,
                Observação: document.getElementById('f-observacao').value
            };

            fetch(URL_API, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            }).then(() => {
                fecharModal();
                setTimeout(buscarNotasDoBanco, 1000);
            });
        }

        // 3. EXCLUIR
        function excluirNota(id) {
            if(confirm("Confirmar exclusão?")) {
                fetch(URL_API + '?id=' + id, { method: 'DELETE' })
                    .then(() => buscarNotasDoBanco());
            }
        }

        function abrirModal(id = null) {
            document.getElementById('modal-nf').classList.remove('hidden');
            // Lógica de preenchimento para edição vai aqui
        }
        function fecharModal() { document.getElementById('modal-nf').classList.add('hidden'); }
        function aplicarFiltros() { /* Sua lógica de filtros aqui */ }
        window.onload = buscarNotasDoBanco;
    </script>
</head>
<body class="p-6">
    <!-- Restante do seu HTML visual vai aqui -->
</body>
</html>
