<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notas Fiscais App</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#1e5bb9">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f5f5f5; -webkit-tap-highlight-color: transparent; }
        .custom-card { background-color: #ffffff; border: 1px solid #e1e1e1; border-radius: 8px; }
        .th-text { color: #666666; font-size: 13px; font-weight: 600; white-space: nowrap; }
        .th-icon { color: #b3b3b3; font-size: 12px; font-weight: normal; }
    </style>
</head>
<body class="p-4 md:p-8 text-[#222222]">

    <div class="max-w-[1500px] mx-auto space-y-6">
        
        <!-- HEADER -->
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
            <div>
                <div class="flex items-center gap-2">
                    <span class="text-2xl">📋</span>
                    <h1 class="text-2xl font-bold text-[#111111]">Notas Fiscais</h1>
                </div>
                <p class="text-xs text-[#777777] mt-1 font-medium">Gerenciamento de recebimento</p>
            </div>
            <div class="flex items-center gap-2 w-full sm:w-auto">
                <button onclick="gerarRelatorioProfissional()" class="flex-1 sm:flex-none flex items-center justify-center gap-1.5 bg-white border border-[#cccccc] hover:bg-gray-50 text-[#333333] text-xs font-semibold px-4 py-2.5 rounded-md shadow-sm">
                    <span class="text-sm">📋</span> Gerar Relatório / PDF
                </button>
                <button onclick="abrirModal()" class="flex-1 sm:flex-none bg-[#1e5bb9] hover:bg-[#164996] text-white text-xs font-semibold px-4 py-2.5 rounded-md shadow-sm">
                    + Nova Nota Fiscal
                </button>
            </div>
        </div>

        <!-- METRICAS -->
        <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
            <div class="custom-card p-4">
                <p class="text-[10px] font-bold text-[#888888] uppercase tracking-wider">Total de Notas</p>
                <p id="card-total" class="text-2xl font-bold text-[#1e5bb9] mt-1">0</p>
            </div>
            <div class="custom-card p-4">
                <p class="text-[10px] font-bold text-[#888888] uppercase tracking-wider">Valor Total</p>
                <p id="card-valor" class="text-xl sm:text-2xl font-bold text-[#111111] mt-1 truncate">R$ 0,00</p>
            </div>
            <div class="custom-card p-4">
                <p class="text-[10px] font-bold text-[#888888] uppercase tracking-wider">Não Acatadas</p>
                <p id="card-nao-acatadas" class="text-2xl font-bold text-[#ca3e3e] mt-1">0</p>
            </div>
            <div class="custom-card p-4">
                <p class="text-[10px] font-bold text-[#888888] uppercase tracking-wider">Acatadas</p>
                <p id="card-acatadas" class="text-2xl font-bold text-[#2e7d32] mt-1">0</p>
            </div>
        </div>

        <!-- FILTROS -->
        <div class="custom-card p-4 space-y-4">
            <div class="flex justify-between items-center">
                <button class="flex items-center gap-1.5 text-xs font-bold text-[#444444]">
                    <span class="text-[9px] text-[#555555]">▼</span> Filtros de Busca
                </button>
                <button onclick="limparFiltros(event)" class="border border-[#cccccc] hover:bg-gray-50 text-[#333333] px-3 py-1 rounded text-xs font-medium bg-white">
                    ✕ Limpar
                </button>
            </div>
            
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-3 pt-2 border-t border-gray-100">
                <div>
                    <label class="text-[11px] font-bold text-[#777777] uppercase">Status Nota</label>
                    <select id="f-status" onchange="renderizarTabela()" class="w-full mt-1 border border-gray-300 rounded px-2 py-1.5 text-xs bg-white">
                        <option value="">Todos</option>
                        <option value="ACATADA">Acatada</option>
                        <option value="NÃO ACATADA">Não Acatada</option>
                    </select>
                </div>
                <div>
                    <label class="text-[11px] font-bold text-[#777777] uppercase">Filtrar Data</label>
                    <input type="text" id="f-data" placeholder="Ex: 22/06/2026" oninput="renderizarTabela()" class="w-full mt-1 border border-gray-300 rounded px-2 py-1.5 text-xs">
                </div>
                <div>
                    <label class="text-[11px] font-bold text-[#777777] uppercase">Fornecedor</label>
                    <input type="text" id="f-fornecedor" placeholder="Buscar..." oninput="renderizarTabela()" class="w-full mt-1 border border-gray-300 rounded px-2 py-1.5 text-xs">
                </div>
                <div>
                    <label class="text-[11px] font-bold text-[#777777] uppercase">Número NF</label>
                    <input type="text" id="f-nf" placeholder="Buscar..." oninput="renderizarTabela()" class="w-full mt-1 border border-gray-300 rounded px-2 py-1.5 text-xs">
                </div>
                <div>
                    <label class="text-[11px] font-bold text-[#777777] uppercase">Valor Máximo</label>
                    <input type="number" id="f-valor" placeholder="Ex: 2000" oninput="renderizarTabela()" class="w-full mt-1 border border-gray-300 rounded px-2 py-1.5 text-xs">
                </div>
            </div>
        </div>

        <!-- TABELA -->
        <div class="custom-card bg-white overflow-hidden">
            <div class="p-4 bg-white">
                <p id="contador-notas" class="text-xs font-medium text-[#777777]">0 notas encontradas</p>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-y border-[#e5e5e5] bg-[#fafafa]">
                            <th class="py-2.5 px-4 th-text">Data</th>
                            <th class="py-2.5 px-4 th-text">Fornecedor</th>
                            <th class="py-2.5 px-4 th-text">NF</th>
                            <th class="py-3 px-4 th-text">Valor</th>
                            <th class="py-2.5 px-4 th-text">Chegada</th>
                            <th class="py-2.5 px-4 th-text">Saída</th>
                            <th class="py-2.5 px-4 th-text">Temp.</th>
                            <th class="py-2.5 px-4 th-text">Conferente</th>
                            <th class="py-2.5 px-4 th-text">Prevenção</th>
                            <th class="py-2.5 px-4 th-text">Status</th>
                            <th class="py-2.5 px-4 th-text">Observação</th>
                            <th class="py-2.5 px-4 text-xs font-bold text-[#666666]">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-corpo" class="text-[13px] text-[#222222] divide-y divide-[#eeeeee]">
                        <tr>
                            <td colspan="12" class="text-center py-6 text-gray-500">Carregando notas fiscais...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- MODAL -->
    <div id="modal-nf" class="hidden fixed inset-0 bg-black/40 flex items-center justify-center p-4 z-50 overflow-y-auto">
        <div class="bg-white rounded-lg shadow-xl border border-gray-200 max-w-lg w-full my-auto overflow-hidden">
            <div class="bg-gray-50 px-4 py-3 border-b flex justify-between items-center">
                <h3 id="modal-titulo" class="font-bold text-sm text-gray-800">Nova Nota Fiscal</h3>
                <button onclick="fecharModal()" class="text-gray-400 hover:text-gray-600 font-bold text-lg">&times;</button>
            </div>
            <form id="form-nf" onsubmit="salvarNota(event)" class="p-4 grid grid-cols-2 gap-3 text-xs max-h-[80vh] overflow-y-auto">
                <input type="hidden" id="edit-id">
                <div>
                    <label class="font-semibold block mb-1">Data</label>
                    <input type="text" id="m-data" required class="w-full border rounded p-1.5" placeholder="22/06/2026">
                </div>
                <div>
                    <label class="font-semibold block mb-1">Fornecedor</label>
                    <input type="text" id="m-fornecedor" required class="w-full border rounded p-1.5">
                </div>
                <div>
                    <label class="font-semibold block mb-1">Número da NF</label>
                    <input type="text" id="m-nf" required class="w-full border rounded p-1.5">
                </div>
                <div>
                    <label class="font-semibold block mb-1">Valor (R$)</label>
                    <input type="number" step="0.01" id="m-valor" required class="w-full border rounded p-1.5">
                </div>
                <div>
                    <label class="font-semibold block mb-1">Horário Chegada</label>
                    <input type="text" id="m-chegada" class="w-full border rounded p-1.5">
                </div>
                <div>
                    <label class="font-semibold block mb-1">Horário Saída</label>
                    <input type="text" id="m-saida" class="w-full border rounded p-1.5">
                </div>
                <div>
                    <label class="font-semibold block mb-1">Temp.</label>
                    <input type="text" id="m-temp" class="w-full border rounded p-1.5">
                </div>
                <div>
                    <label class="font-semibold block mb-1">Conferente</label>
                    <input type="text" id="m-conferente" class="w-full border rounded p-1.5">
                </div>
                <div>
                    <label class="font-semibold block mb-1">Prevenção</label>
                    <input type="text" id="m-prevencao" class="w-full border rounded p-1.5">
                </div>
                <div>
                    <label class="font-semibold block mb-1">Status</label>
                    <select id="m-status" class="w-full border rounded p-1.5 bg-white">
                        <option value="NÃO ACATADA">Não Acatada</option>
                        <option value="ACATADA">Acatada</option>
                    </select>
                </div>
                <div class="col-span-2">
                    <label class="font-semibold block mb-1">Observação</label>
                    <input type="text" id="m-observacao" class="w-full border rounded p-1.5">
                </div>
                <div class="col-span-2 flex justify-end gap-2 pt-3 border-t mt-2">
                    <button type="button" onclick="fecharModal()" class="border px-4 py-1.5 rounded bg-gray-50 hover:bg-gray-100 font-medium">Cancelar</button>
                    <button type="submit" id="btn-salvar" class="bg-[#1e5bb9] text-white px-4 py-1.5 rounded hover:bg-[#164996] font-medium">Salvar Nota</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const SCRIPT = 'https://script.google.com/macros/s/AKfycbzVqJ6ptOTzAJhDfucvI0NW4VhwpcrIi71QQRNzfwb40LRJPYXrfKnkJyul54V1RdJM/exec';
        let notas = [];

        function buscarNotasDoBanco() {
            fetch(SCRIPT)
                .then(response => response.json())
                .then(dados => {
                    notas = dados.map(item => {
                        let valorCru = item.Valor ? item.Valor.toString() : '0';
                        valorCru = valorCru.replace('R$', '').replace(/\s/g, '');
                        let valorNumerico = valorCru.includes(',') ? parseFloat(valorCru.replace(/\./g, '').replace(',', '.')) : parseFloat(valorCru);

                        return {
                            id: item.id ? item.id.toString() : (Date.now() + Math.random()).toString(),
                            data: item.Data || '',
                            fornecedor: item.Fornecedor || '',
                            nf: item.NF || '',
                            valor: isNaN(valorNumerico) ? 0 : valorNumerico,
                            chegada: item.Chegada || '-',
                            saida: item.Saída || item.Saida || '-',
                            temp: item.Temp || '-',
                            conferente: item.Conferente || '-',
                            prevencao: item.Prevenção || item.Prevencao || '-',
                            status: (item.Status || 'NÃO ACATADA').toUpperCase(),
                            observacao: item.Observação || item.Observacao || '-'
                        };
                    });
                    renderizarTabela();
                })
                .catch(erro => console.error("Erro ao buscar:", erro));
        }

        function abrirModal(id = null) {
            document.getElementById('modal-nf').classList.remove('hidden');
            if (id) {
                const nota = notas.find(n => n.id === id);
                document.getElementById('modal-titulo').innerText = "Editar Nota Fiscal";
                document.getElementById('edit-id').value = nota.id;
                document.getElementById('m-data').value = nota.data;
                document.getElementById('m-fornecedor').value = nota.fornecedor;
                document.getElementById('m-nf').value = nota.nf;
                document.getElementById('m-nf').disabled = true;
                document.getElementById('m-valor').value = nota.valor;
                document.getElementById('m-chegada').value = nota.chegada;
                document.getElementById('m-saida').value = nota.saida;
                document.getElementById('m-temp').value = nota.temp;
                document.getElementById('m-conferente').value = nota.conferente;
                document.getElementById('m-prevencao').value = nota.prevencao;
                document.getElementById('m-status').value = nota.status;
                document.getElementById('m-observacao').value = nota.observacao;
            } else {
                document.getElementById('modal-titulo').innerText = "Nova Nota Fiscal";
                document.getElementById('form-nf').reset();
                document.getElementById('edit-id').value = "";
                document.getElementById('m-nf').disabled = false;
                document.getElementById('m-data').value = new Date().toLocaleDateString('pt-BR');
            }
        }

        function fecharModal() { document.getElementById('modal-nf').classList.add('hidden'); }

function salvarNota(e) {
    e.preventDefault();
    const id = document.getElementById('edit-id').value;
    const payload = {
        "id": id || Date.now().toString(),
        "Data": document.getElementById('m-data').value,
        "Fornecedor": document.getElementById('m-fornecedor').value,
        "NF": document.getElementById('m-nf').value,
        "Valor": parseFloat(document.getElementById('m-valor').value),
        "Chegada": document.getElementById('m-chegada').value,
        "Saída": document.getElementById('m-saida').value,
        "Temp": document.getElementById('m-temp').value,
        "Conferente": document.getElementById('m-conferente').value,
        "Prevenção": document.getElementById('m-prevencao').value,
        "Status": document.getElementById('m-status').value,
        "Observação": document.getElementById('m-observacao').value
    };

    // Simplificando: enviando apenas o payload diretamente
    const method = id ? 'POST' : 'POST'; // Muitas vezes o GAS funciona melhor apenas com POST
    const url = SCRIPT; 

    fetch(url, { 
        method: method, 
        mode: 'no-cors', // Adicione isso se estiver recebendo erro de CORS
        headers: { 'Content-Type': 'application/json' }, 
        body: JSON.stringify(payload) 
    })
    .then(() => { 
        fecharModal(); 
        // Pequena pausa para garantir que o Sheets processou
        setTimeout(buscarNotasDoBanco, 1000); 
    })
    .catch(err => console.error("Erro ao salvar:", err));
}

        function excluirNota(id) {
            if(confirm("Excluir nota?")) {
                fetch(`${SCRIPT}/id/${id}`, { method: 'DELETE' }).then(() => buscarNotasDoBanco());
            }
        }

        function limparFiltros(e) {
            e.stopPropagation();
            document.querySelectorAll('select, input').forEach(el => el.value = "");
            renderizarTabela();
        }

        function obterFiltrados() {
            const fStatus = document.getElementById('f-status').value;
            const fData = document.getElementById('f-data').value.toLowerCase();
            const fFornecedor = document.getElementById('f-fornecedor').value.toLowerCase();
            const fNf = document.getElementById('f-nf').value.toLowerCase();
            const fValor = document.getElementById('f-valor').value;

            return notas.filter(nota => 
                (!fStatus || nota.status === fStatus) &&
                (!fData || nota.data.toLowerCase().includes(fData)) &&
                (!fFornecedor || nota.fornecedor.toLowerCase().includes(fFornecedor)) &&
                (!fNf || nota.nf.toLowerCase().includes(fNf)) &&
                (!fValor || nota.valor <= parseFloat(fValor))
            );
        }

        function renderizarTabela() {
            const corpo = document.getElementById('tabela-corpo');
            corpo.innerHTML = "";
            let filtrados = obterFiltrados();
            let totalValor = 0, naoAcatadas = 0, acatadas = 0;

            filtrados.forEach(n => {
                totalValor += n.valor;
                n.status === "ACATADA" ? acatadas++ : naoAcatadas++;
            });

            [...filtrados].reverse().forEach(nota => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="py-3 px-4">${nota.data}</td>
                    <td class="py-3 px-4 font-medium">${nota.fornecedor}</td>
                    <td class="py-3 px-4">${nota.nf}</td>
                    <td class="py-3 px-4 font-bold">R$ ${nota.valor.toLocaleString('pt-BR', {minimumFractionDigits: 2})}</td>
                    <td class="py-3 px-4">${nota.chegada}</td>
                    <td class="py-3 px-4">${nota.saida}</td>
                    <td class="py-3 px-4">${nota.temp}</td>
                    <td class="py-3 px-4">${nota.conferente}</td>
                    <td class="py-3 px-4">${nota.prevencao}</td>
                    <td class="py-3 px-4"><span class="${nota.status === "ACATADA" ? "bg-green-50 text-green-700" : "bg-red-50 text-red-700"} text-[10px] font-bold px-1.5 py-0.5 rounded border">${nota.status}</span></td>
                    <td class="py-3 px-4">${nota.observacao}</td>
                    <td class="py-3 px-4 flex gap-3">
                        <button onclick="abrirModal('${nota.id}')" class="text-amber-500">✏️</button>
                        <button onclick="excluirNota('${nota.id}')" class="text-red-400">🗑️</button>
                    </td>
                `;
                corpo.appendChild(tr);
            });

            document.getElementById('card-total').innerText = filtrados.length;
            document.getElementById('card-valor').innerText = `R$ ${totalValor.toLocaleString('pt-BR', {minimumFractionDigits: 2})}`;
            document.getElementById('card-nao-acatadas').innerText = naoAcatadas;
            document.getElementById('card-acatadas').innerText = acatadas;
            document.getElementById('contador-notas').innerText = `${filtrados.length} notas encontradas`;
        }

        function gerarRelatorioProfissional() {
            let dados = obterFiltrados();
            let lines = dados.map(n => `<tr><td style='padding:12px;'>${n.data}</td><td style='padding:12px;'>${n.fornecedor}</td><td style='padding:12px;'>${n.nf}</td><td style='padding:12px;'>R$ ${n.valor.toFixed(2)}</td><td style='padding:12px;'>${n.status}</td></tr>`).join('');
            let novaAba = window.open();
            novaAba.document.write(`<html><body><h1>Relatório</h1><table border='1'>${lines}</table><button onclick='window.print()'>Imprimir</button></body></html>`);
            novaAba.document.close();
        }

        window.onload = buscarNotasDoBanco;
    </script>
</body>
</html>
